name: Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu
      description: Comportamento observado. Inclua mensagens de erro.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Como reproduzir
      description: Passos mínimos.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão / commit
  - type: textarea
    id: env
    attributes:
      label: Ambiente
      description: SO, runtime, versão do navegador etc.

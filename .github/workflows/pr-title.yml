name: pr-title

# O título do PR vira a mensagem do squash merge, então precisa ser Conventional Commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            chore
            revert
            style
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "O assunto deve começar com letra minúscula (inglês, imperativo)."
